; ============================================================================
; PlatformIO Projekat: Kontroler Grejanja + Termometar v1.2 (WiFiManager + OTA)
; Oba uređaja koriste WiFiManager (nema šifara u kodu!) i podržavaju OTA:
;   1. [env:kontroler]      -> USB flešovanje kontrolera
;   2. [env:kontroler_ota]  -> Bežično (OTA) flešovanje kontrolera i LittleFS-a
;   3. [env:termometar]     -> USB flešovanje termometra
;   4. [env:termometar_ota] -> Bežično (OTA) flešovanje termometra
; ============================================================================

[platformio]
default_envs = kontroler, termometar
data_dir = data

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; ----------------------------------------------------------------------------
; 1A. KONTROLER GREJANJA - USB FLEŠOVANJE
; ----------------------------------------------------------------------------
[env:kontroler]
build_src_filter = +<kontroler/*> -<termometar/*>
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    tzapu/WiFiManager @ ^0.16.0

; ----------------------------------------------------------------------------
; 1B. KONTROLER GREJANJA - BEŽIČNO (OTA) FLEŠOVANJE
; (Promeni upload_port u IP adresu kontrolera, npr. 192.168.1.75)
; ----------------------------------------------------------------------------
[env:kontroler_ota]
extends = env:kontroler
upload_protocol = espota
upload_port = 192.168.1.75

; ----------------------------------------------------------------------------
; 2A. TERMOMETAR v1.2 (D4 DS18B20, D2/D1 OLED 0x3C, WiFiManager + OTA) - USB
; ----------------------------------------------------------------------------
[env:termometar]
build_src_filter = +<termometar/*> -<kontroler/*>
board_build.ldscript = eagle.flash.4m2m.ld
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    bblanchon/ArduinoJson @ ^6.21.5
    tzapu/WiFiManager @ ^0.16.0

; ----------------------------------------------------------------------------
; 2B. TERMOMETAR v1.2 - BEŽIČNO (OTA) FLEŠOVANJE
; Uređaj je stalno dostupan na mreži za OTA update (termometar-senzor.local ili IP)
; ----------------------------------------------------------------------------
[env:termometar_ota]
extends = env:termometar
upload_protocol = espota
upload_port = termometar-senzor.local
